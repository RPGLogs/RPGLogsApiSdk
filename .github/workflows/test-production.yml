name: Test Production

on:
#  schedule:
#    # run every hour
#    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  test-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: yarn install
      - run: yarn lint
      - run: yarn generate
        env:
          RPGLOGS_API_CLIENT_ID: ${{ secrets.RPGLOGS_API_CLIENT_ID }}
          RPGLOGS_API_CLIENT_SECRET: ${{ secrets.RPGLOGS_API_CLIENT_SECRET }}
      - run: yarn test
        env:
          RPGLOGS_API_CLIENT_ID: ${{ secrets.RPGLOGS_API_CLIENT_ID }}
          RPGLOGS_API_CLIENT_SECRET: ${{ secrets.RPGLOGS_API_CLIENT_SECRET }}
